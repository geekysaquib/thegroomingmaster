<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grooming Master</title>
    <meta name="description" content="Luxury grooming for him and her. Book your appointment online." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same font stack as monoZHub: Inter primary, DM Sans fallback. -->
    <!-- Inter Tight = public site font; Cinzel is only used for the CM monogram inside the logo. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter+Tight:ital,wght@0,300..800;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved theme before first paint (no flash). Light is the monoZHub default. -->
    <script>
      try { document.documentElement.setAttribute("data-mode", localStorage.getItem("gm_mode") || "light"); }
      catch (e) { document.documentElement.setAttribute("data-mode", "light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
