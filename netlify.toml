# One Netlify site serves both parts of the app:
#   - the React frontend (frontend/)  -> static files in frontend/dist
#   - the Express API   (backend/)    -> a single Netlify Function, reached at /api/*
# The repo root has no package.json, so each part installs its own dependencies in the build command.
[build]
  command = "npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "backend/netlify/functions"
  # Default bundler: traces and ships the function's node_modules as-is (keeps pdfkit's font files intact).

# API: /api/* -> the Express app running as the "api" function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Single-page app fallback: every other path (/login, /salon/calendar, /contact ...) serves index.html
# so React Router can handle it on refresh / direct links instead of Netlify's "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
